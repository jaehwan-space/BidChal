name: Deploy to Proxmox

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Frontend Dependencies
        run: pnpm install --filter frontend

      - name: Build Frontend
        run: pnpm --filter frontend run build

      - name: Deploy Frontend to Proxmox Nginx
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.PROXMOX_HOST }}
          username: ${{ secrets.PROXMOX_USERNAME }}
          port: ${{ secrets.PROXMOX_SSH_PORT }}
          key: ${{ secrets.PROXMOX_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/bidchal"
          strip_components: 2

      - name: Deploy Backend via Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROXMOX_HOST }}
          username: ${{ secrets.PROXMOX_USERNAME }}
          port: ${{ secrets.PROXMOX_SSH_PORT }}
          key: ${{ secrets.PROXMOX_SSH_KEY }}
          script: |
            cd /home/${{ secrets.PROXMOX_USERNAME }}/BidChal || mkdir -p /home/${{ secrets.PROXMOX_USERNAME }}/BidChal
            
            git reset --hard origin/main
            git pull origin main
            
            # 도커 빌드 & 재시작
            curl -SL https://github.com/docker/compose/releases/download/v2.26.1/docker-compose-linux-x86_64 -o ./docker-compose-bin
            chmod +x ./docker-compose-bin
            
            ./docker-compose-bin -f docker-compose.prod.yml down
            ./docker-compose-bin -f docker-compose.prod.yml up -d --build
