name: Deploy to Proxmox

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Frontend Dependencies
        run: pnpm install --filter frontend

      - name: Build Frontend
        run: pnpm --filter frontend run build

      - name: Deploy Frontend to Proxmox Nginx
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.PROXMOX_HOST }}
          username: ${{ secrets.PROXMOX_USERNAME }}
          port: ${{ secrets.PROXMOX_SSH_PORT }}
          key: ${{ secrets.PROXMOX_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/bidchal"
          strip_components: 2

      - name: Configure Nginx
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROXMOX_HOST }}
          username: ${{ secrets.PROXMOX_USERNAME }}
          port: ${{ secrets.PROXMOX_SSH_PORT }}
          key: ${{ secrets.PROXMOX_SSH_KEY }}
          command_timeout: 30s
          script: |
            cd /home/${{ secrets.PROXMOX_USERNAME }}/BidChal

            # Nginx 설정 동기화 및 리로드 (NOPASSWD 필요, 실패해도 계속 진행)
            if sudo -n true 2>/dev/null; then
              sudo cp nginx_example.conf /etc/nginx/sites-available/bidchal
              sudo ln -sf /etc/nginx/sites-available/bidchal /etc/nginx/sites-enabled/bidchal
              sudo nginx -t && sudo systemctl reload nginx
              echo "✅ Nginx 설정 업데이트 완료"
            else
              echo "⚠️ sudo 권한 없음 - Nginx 설정 건너뛰기 (수동으로 설정해주세요)"
            fi

      - name: Deploy Backend via Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROXMOX_HOST }}
          username: ${{ secrets.PROXMOX_USERNAME }}
          port: ${{ secrets.PROXMOX_SSH_PORT }}
          key: ${{ secrets.PROXMOX_SSH_KEY }}
          command_timeout: 600s
          script: |
            cd /home/${{ secrets.PROXMOX_USERNAME }}/BidChal || mkdir -p /home/${{ secrets.PROXMOX_USERNAME }}/BidChal
            
            git reset --hard origin/main
            git pull origin main
            
            # docker compose 사용 가능 여부 확인
            if command -v docker compose &> /dev/null; then
              COMPOSE_CMD="docker compose"
            elif [ -f ./docker-compose-bin ]; then
              COMPOSE_CMD="./docker-compose-bin"
            else
              echo "📥 docker-compose 바이너리 다운로드 중..."
              curl -SL https://github.com/docker/compose/releases/download/v2.26.1/docker-compose-linux-x86_64 -o ./docker-compose-bin
              chmod +x ./docker-compose-bin
              COMPOSE_CMD="./docker-compose-bin"
            fi
            
            echo "🔽 기존 컨테이너 중지..."
            $COMPOSE_CMD -f docker-compose.prod.yml down --timeout 30 || true
            
            echo "🔨 새 컨테이너 빌드 및 시작..."
            $COMPOSE_CMD -f docker-compose.prod.yml up -d --build
            
            echo "✅ 배포 완료!"
