# nginx_example.conf (서버 세팅 가이드)
# 이 파일은 사용자의 Proxmox 서버 (Nginx 단 위치) 에 아래와 같이 적용되어야 합니다.
# 주로 리버스 프록시 설정이므로 /etc/nginx/sites-available/bidchal 등에 저장 후 ln -s 로 sites-enabled에 연결합니다.

server {
    listen 80;
    server_name NAS.jhwan.xyz server.jhwan.xyz; # 실제 사용할 도메인으로 변경하세요

    # 프로덕션에서는 certbot 등을 이용해 443 (HTTPS) 포트로 리디렉션 하는 것을 강력히 권장합니다.
    # 해당 부분은 Nginx Proxy Manager를 사용하실 경우 GUI에서 설정가능합니다.
    
    # 1. 프론트엔드 정적 파일 서빙
    location / {
        root /var/www/bidchal; # Github Actions가 매번 이 경로로 빌드된 파일(dist 폴더 내용물)을 전송합니다.
        index index.html;
        try_files $uri $uri/ /index.html; # React Router가 동작하게 하는 필수 설정입니다.
    }

    # 2. 백엔드 API 서버 (Node.js) 연결
    location /api/ {
        # 백엔드 도커가 로컬(Proxmox 서버 내부) 4000번 포트로 떠있다고 가정합니다.
        proxy_pass http://127.0.0.1:4000/api/;
        
        # Socket.io 및 표준 리버스 프록시 헤더 설정
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 3. 백엔드 소켓 통신 전용 경로 (Socket.io)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
